services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "65432:8000"
    env_file:
      - .env
    volumes:
      - ./docker-data:/app/docker-data
      - ./cache:/app/cache
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kolkata
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        tag: "{{.Name}}"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "64321:80"
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        tag: "{{.Name}}"

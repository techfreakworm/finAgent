services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "65432:8000"
    env_file:
      - .env
    volumes:
      - ./docker-data:/app/docker-data
      - ./cache:/app/cache
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kolkata
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "64321:80"
    depends_on:
      - backend
    restart: unless-stopped
